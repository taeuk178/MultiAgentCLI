goal: |
  iOS 팀의 사내 프로젝트 컨텍스트(Slack 대화, Notion 기획 정의서)를 imprint
  Claude Code plugin이 lazy-fetch로 흡수하고, prefill 단계에서 LLM에 자동 보강하며,
  Stop hook에서 응답을 chunk로 추출해 memory에 환류하는 ingestion + rewrite-suggestion
  파이프라인을 추가한다.

constraints:
  - "Claude Code hook 모델: UserPromptSubmit hook은 prompt 자체를 교체할 수 없고 stdout으로 추가 컨텍스트만 prepend 가능하다"
  - "인증: OAuth 구독 기반(claude/codex/gemini CLI), 별도 API key 사용 금지"
  - "저장소: 로컬 SQLite ~/.claude/imprint/app.sqlite + project-local .imprint/sources.json. 서버형 공유 DB 미사용"
  - "배포: iOS 팀 멤버 BYO. 각자 plugin 설치, 메모리·자격증명 공유 없음"
  - "런타임 의존: bash, python3, sqlite3, uuidgen, claude CLI (모호도 분석 + chunk 추출용). codex/gemini는 advisor 한정"
  - "외부 소스: Slack MCP + Notion(API 또는 마크다운 파일). 둘 중 하나 또는 모두 부재해도 plugin은 정상 동작해야 한다 (graceful degradation)"
  - "hook 실패가 사용자 세션을 차단해서는 안 된다 (기존 plugin 정책 유지)"
  - ".imprint/ 폴더는 SessionStart hook이 시드하며 기존 파일은 절대 덮어쓰지 않는다"

acceptance_criteria:
  - id: AC1
    description: ".imprint/sources.json에 정의된 Slack 채널·Notion 페이지가 prefill 시점에 UserPromptSubmit hook에 의해 lazy-fetch되고 [Project memory context] 블록에 prepend된다"
  - id: AC2
    description: "매 prompt마다 claude -p가 모호도 점수 + 키워드를 JSON으로 반환하고, 모호도 임계치(예: 0.5) 초과 시 [Refined prompt suggestion: ...] 블록이 prepend된다"
  - id: AC3
    description: "Stop hook이 LLM 응답을 claude -p로 분석해 decision/error/fix/todo/code_context chunk를 자동 추출하고 memory_chunks 테이블에 저장한다 (events archive는 기존대로 유지)"
  - id: AC4
    description: "sources.json이 없거나 일부 소스만 정의돼 있어도, 또는 claude -p / Slack MCP / Notion fetch가 실패해도 plugin은 graceful degradation으로 동작 — 누락된 단계는 silent skip하고 가능한 한 기존 prepend로 fallback한다"
  - id: AC5
    description: "iOS 팀 멤버 1명이 1주일 동안 실제 사내 iOS 프로젝트에서 사용한 뒤 '프로젝트 컨텍스트가 자동으로 따라온다'고 정성적으로 확인한다"
  - id: AC6
    description: "모든 외부 소스 chunk는 memory_chunks.metadata_json에 source(slack|notion) + url(있을 시) + fetched_at이 채워져 있어야 한다. Slack은 channel·author·posted_at, Notion은 page_id·page_title·section_title 추가"
  - id: AC7
    description: "외부 소스 chunk는 events 테이블에 기록하지 않는다 (source_event_id IS NULL). events는 user/LLM/hook/skill의 자체 I/O 전용 의미를 보존"
  - id: AC8
    description: "claude -p가 외부 청크를 분류할 때 소스 구분 없이 기존 9개 chunk_type(decision/error/fix/command/test_result/summary/todo/code_context/note) 중 하나를 선택한다. 소스별 후보군 분기는 두지 않는다"
  - id: AC9
    description: "신규 팀 멤버가 git에서 .imprint/sources.json만 받아온 상태로 plugin을 설치해도, 모호한 prompt에서 prefill 분석 → lazy fetch → suggestion 흐름이 동일하게 동작한다 (BYO 격리 검증)"
  - id: AC10
    description: "memory_chunks_fts·events_fts가 trigram tokenizer로 빌드되어 있고, 한국어 부분문자열 검색('더스트' → '더스트가/더스트의')이 hit한다. SessionStart hook이 기존 unicode61 인덱스를 감지하면 DROP + REBUILD migration을 수행한다"
  - id: AC11
    description: "Stop hook의 claude -p chunk 추출 응답 schema에 keywords: string[] 필드가 포함되고, memory_chunks.metadata_json.keywords로 보존된다. prefill 검색은 FTS5 MATCH + keywords 배열 hit를 union으로 묶어 ranking한다"
  - id: AC12
    description: "prompt에 Slack permalink가 포함되면 hook이 정규식으로 감지해 fetch한다. thread permalink는 conversations.replies로 paginated 전체 reply fetch 후 claude -p haiku가 prompt와 관련 있는 reply만 selection + summary로 압축해 1~3 chunk로 저장. single message permalink는 1 chunk로"
  - id: AC13
    description: "claude -p 호출은 모두 --model haiku로 실행된다 (prefill 모호도 분석, stop chunk 추출, Slack thread reply selection 모두). Sonnet은 메인 응답에만 사용"
  - id: AC14
    description: "Notion fetch는 사용자 환경에 이미 등록된 Notion MCP를 호출한다. 마크다운 다운로드 파일에 의존하지 않는다"
  - id: AC15
    description: "외부 소스 lazy fetch는 metadata_json.url 기반 dedup. 이미 존재하는 url은 fetch API 호출 자체를 skip하고 기존 chunk를 재사용한다 (TTL 무한)"
  - id: AC16
    description: "/memory refresh 명령(<url>|source slack|source notion|project)이 동작하며, 대상 chunk를 DELETE 후 재 fetch + INSERT한다. 자연어 키워드 자동 트리거는 없다"
  - id: AC17
    description: "Notion chunk metadata에 last_edited_at(Notion API의 last_edited_time)이 보존된다. Slack chunk는 메시지가 수정된 경우 edited_at이 보존된다 (없으면 키 생략)"

ontology_schema:
  name: ContextIngestionPipeline
  description: "Slack/Notion → memory → prefill rewrite-suggestion → claude → stop-chunk-extraction 파이프라인의 데이터 모델"
  fields:
    - name: sources_config
      type: object
      description: |
        <project>/.imprint/sources.json 의 형식.
        예: { "slack": { "channels": ["#ios-payment"] }, "notion": { "pages": ["a1b2c3d4-prd"] } }
    - name: memory_chunks
      type: array
      description: |
        기존 SQLite schema 재사용 (DDL 변경 없음). chunk_type은 기존 9개
        (decision/error/fix/command/test_result/summary/todo/code_context/note) 그대로 사용.
        외부 소스(Slack/Notion)는 events를 거치지 않고 바로 memory_chunks에만 insert
        (source_event_id IS NULL). 출처와 신선도는 metadata_json으로 보존.
    - name: chunk_metadata_schema
      type: object
      description: |
        memory_chunks.metadata_json의 표준 필드 (D13 + D23 확장).
        common: { source: "slack"|"notion", url: string, fetched_at: ISO8601, keywords: string[] }
        slack:  + { channel: string, author: string, posted_at: ISO8601, edited_at?: ISO8601 }
        notion: + { page_id: string, page_title: string, section_title?: string, last_edited_at: ISO8601 }
        url은 dedup key (D22). last_edited_at·edited_at은 현재는 stale 감지 미사용, 미래 활용을 위해 보존.
    - name: prefill_analysis_result
      type: object
      description: "UserPromptSubmit에서 claude -p가 반환하는 JSON. {ambiguity_score: float, keywords: array<string>, refined_prompt: string|null}"
    - name: stop_extraction_result
      type: array
      description: "Stop hook에서 claude -p가 반환하는 chunk 후보 list. 각 항목: {chunk_type, text, metadata}"
    - name: chunk_source_metadata
      type: object
      description: "chunk가 prefill에 prepend될 때 출처를 prefix로 표시: [slack:#ios-payment 2026-04-20 @kim], [notion:prd-payment]"

evaluation_principles:
  - principle: correctness
    weight: 0.35
    description: "9개 결정사항이 모두 구현·관찰 가능한 형태로 코드에 반영되었는가"
  - principle: safety
    weight: 0.25
    description: "graceful degradation으로 모든 실패 모드(소스 부재, MCP 다운, claude -p 실패)에서 사용자 세션이 차단되지 않는가"
  - principle: usability
    weight: 0.20
    description: "iOS 팀 멤버가 기존 사용 흐름 끊김 없이 점진적으로 컨텍스트 보강을 체감하는가"
  - principle: cost_control
    weight: 0.20
    description: "매 prompt마다 추가 claude -p 호출 2회(prefill 분석 + stop 추출)가 OAuth rate limit과 latency 한계 안에서 견디는가"

exit_conditions:
  - "AC1~AC5 모두 충족"
  - "iOS 팀 정성 검증 1주 통과"
  - "README.md, LoadMap.md, HANDOFF.md가 narrative와 일치하게 update됨"

decisions:
  - id: D1
    topic: "사용 시나리오"
    decision: "iOS 팀 멤버가 각자 plugin을 설치(BYO)하고 프로젝트별 메모리를 분리한다. 서버 미사용, 로컬 SQLite + project-local sources.json만 사용"
  - id: D2
    topic: "다듬기 정의"
    decision: "평소엔 컨텍스트 prepend만, 모호도가 임계치 초과 시에만 [Refined prompt suggestion: ...] 블록을 추가 prepend"
  - id: D3
    topic: "사용자 가시성"
    decision: "자동 움직임 (silent). suggestion 블록이 LLM 컨텍스트에 표시되며 사용자는 매번 confirm하지 않음"
  - id: D4
    topic: "Rewrite 메커니즘"
    decision: "hook은 prompt 자체를 교체하지 못하므로 [Refined prompt suggestion: ...] 블록을 prepend하고 soul.md 룰로 LLM이 우선시하도록 유도"
  - id: D5
    topic: "Ingestion 트리거"
    decision: "Lazy fetch — prefill 시점에 prompt 키워드로 Slack/Notion을 on-demand 조회. 메모리 누적은 자연스러운 부산물"
  - id: D6
    topic: "Source 정의 위치"
    decision: "<project>/.imprint/sources.json (git-share 가능). 없으면 SessionStart hook이 안내 메시지만 prepend"
  - id: D7
    topic: "모호도 + 키워드 추출"
    decision: "매 prompt마다 claude -p 호출. JSON 형식 {ambiguity_score, keywords, refined_prompt}로 회신"
  - id: D8
    topic: "Stop hook 처리"
    decision: "기존 events archive 유지 + claude -p로 자동 chunk 추출 추가. 추출된 chunk는 memory_chunks에 source_event_id로 연결"
  - id: D9
    topic: "First milestone scope"
    decision: "전체 파이프라인 + graceful degradation 한 번에. Slack only / Notion only / 외부 소스 없음 모두 지원"
  - id: D10
    topic: "출처 표시 위치"
    decision: "memory_chunks.metadata_json에 source 필드로 표시. DDL 변경(새 chunk_type, 새 컬럼) 하지 않음"
  - id: D11
    topic: "events 테이블 포함 여부"
    decision: "외부 소스 chunk는 events에 기록하지 않음. memory_chunks에만 직접 insert (source_event_id NULL). events는 user/LLM/hook/skill 자체 I/O 의미 보존"
  - id: D12
    topic: "chunk_type 분류 정책"
    decision: "claude -p가 9개 전체 후보(decision/error/fix/command/test_result/summary/todo/code_context/note) 중 자유 선택. 소스별 후보군 분기 없음"
  - id: D13
    topic: "metadata 표준 필드"
    decision: "공통 source/url/fetched_at, Slack은 channel·author·posted_at, Notion은 page_id·page_title·section_title. Slack url은 사용자 명시 요청"
  - id: D14
    topic: "팀 멤버 간 메모리 공유 정책"
    decision: |
      기본 격리. memory_chunks(SQLite ~/.claude/imprint/app.sqlite)는 멤버별 로컬 only.
      <project>/.imprint/sources.json 만 git-share — 팀이 같은 외부 source-of-truth를 lazy fetch로 자연 재구성한다.
      LLM 응답에서 Stop hook이 추출한 내부 chunk(decision/todo/fix 등)는 작성자의 작업 기억으로 간주, 자동 공유 없음.
      이유: chunk엔 디버그 출력·코드 fragment·외부 API 응답이 섞여 있어 자동 push 위험 큼.
  - id: D15
    topic: "메모리 migration (선택적, 후순위 milestone)"
    decision: |
      first milestone에서는 구현하지 않음. 후속 milestone에서 명시 export/import 명령 추가.
      `/memory export <project>` → memory_chunks(+metadata) JSON dump.
      `/memory import <file>` → 사용자가 검토 후 수동 적용. chunk_id 충돌은 새 ID 발급.
      민감정보 redaction은 export 시점 사용자 책임. 자동 git commit/push 절대 없음.
      활용 케이스: 휴가자 인계, 신규 멤버 합류 시 작업 기억 핸드오프.
  - id: D16
    topic: "검색 인프라 — FTS5 tokenizer"
    decision: |
      first milestone은 SQLite FTS5만 사용. 단, tokenizer를 'trigram'으로 변경해
      한국어 형태 변화·부분문자열 매칭을 보강한다 (기본 unicode61은 공백 기반 토큰화로 한국어 약함).
      schema.sql의 memory_chunks_fts·events_fts 모두 적용. SessionStart hook에 기존 인덱스
      tokenizer 불일치 감지 시 DROP + REBUILD migration 단계 추가.
      Vector DB·임베딩은 도입하지 않음 (의존성 0, 비용 0 유지).
  - id: D17
    topic: "chunk 추출 보조 인덱스 — keywords 배열"
    decision: |
      claude -p가 stop hook에서 chunk를 추출할 때 응답 schema에 keywords array를 함께 요구.
      memory_chunks.metadata_json.keywords (string[])로 보존. prefill 검색은 (1) FTS5 MATCH +
      (2) keywords 배열 hit을 union으로 묶어 ranking. 트리거 SQL이 아닌 application-level 보강.
  - id: D18
    topic: "Vector DB는 Phase 2 후순위"
    decision: |
      first milestone에서 도입 안 함. 후속 milestone에서 sqlite-vec extension + 로컬 임베딩 모델
      (Ollama 또는 sentence-transformers)로 추가. 임베딩 생성은 chunk insert 시 비동기 background.
      도입 트리거: chunk 누적이 수천 단위에 도달 + FTS5(trigram) 한계가 실증됨 (의역·언어 혼용 검색 실패율 ↑).
      PageIndex 스타일 reasoning-based tree retrieval은 우리 데이터 패턴(Slack 단편 + 짧은 Notion 섹션)에
      부적합 — 비채택. Notion 구조는 metadata의 page_id + section_title path로만 보존, 트리 reconstruct는 후일 가능성으로 둠.
  - id: D19
    topic: "claude -p 모델 (D7·D8 보강)"
    decision: |
      모호도 분석(prefill)·chunk 추출(stop) 모두 claude haiku 사용. Sonnet 대비 latency·rate-limit 여유 ↑,
      분류·요약 작업 정확도는 충분. provider CLI 호출 시 모델 명시: claude -p --model haiku ...
  - id: D20
    topic: "Slack lazy fetch 모델 (D5 보강)"
    decision: |
      두 모드 공존:
      (a) URL 명시 모드 — prompt 안에 Slack permalink 감지 시 즉시 fetch.
          · thread permalink (thread_ts 포함): conversations.replies로 전체 reply paginated fetch
            → claude -p(haiku)가 prompt와 관련 있는 reply만 selection + summary로 압축
            → 1~3 chunk(원본 인용 + summary)로 memory_chunks insert
          · single message permalink: 해당 메시지만 단건 fetch → 1 chunk
      (b) 키워드 검색 모드 — URL 없을 때 .imprint/sources.json 채널에서 키워드 매칭
      Slack MCP는 사용자 환경에 이미 등록된 것 사용 (인증·범위는 사용자 책임).
  - id: D21
    topic: "Notion fetch 인터페이스 (D5 보강)"
    decision: |
      사용자 환경에 등록된 Notion MCP 사용. 마크다운 다운로드 파일 의존 안 함.
      페이지 URL 또는 page_id로 fetch, 섹션 단위 분해 후 chunk화. metadata에 page_id·page_title·section_title 보존(D13).
  - id: D22
    topic: "Lazy fetch dedup (Slack/Notion 공통)"
    decision: |
      외부 소스 chunk의 dedup key는 metadata_json.url.
      lazy fetch 직전에 SELECT 1 FROM memory_chunks WHERE project_id=? AND json_extract(metadata_json,'$.url')=? 확인.
      이미 존재하면 fetch 자체를 skip (Slack/Notion API 호출도 발생하지 않음).
      기존 chunk가 prefill 검색에서 자연 hit. TTL 무한, 자동 만료 없음.
  - id: D23
    topic: "metadata 표준 필드 보강 (D13 확장)"
    decision: |
      Notion chunk metadata에 last_edited_at 필드 추가 (Notion API 응답의 last_edited_time을 그대로 보존).
      Slack chunk metadata에 edited_at 필드 추가 (메시지가 수정된 경우만, 없으면 키 생략).
      현재는 stale 감지 로직 없음. 미래 stale 판단·force-refresh 우선순위·history 정렬에 활용 가능성으로 보존.
  - id: D24
    topic: "force-refresh 정책 (TTL=∞ 보완)"
    decision: |
      자동 갱신 트리거 없음. 사용자 명시 명령만 발화:
      · /memory refresh <url>          — 단일 URL의 chunk 갱신
      · /memory refresh source slack   — 슬랙 chunk 전체 갱신
      · /memory refresh source notion  — 노션 chunk 전체 갱신
      · /memory refresh project        — 외부 소스 chunk 전체 갱신
      동작: 대상 chunk DELETE → 재 fetch → 새 chunk INSERT (덮어쓰기). history 보존 안 함 (Slack/Notion 원본이 source-of-truth).
      자연어 키워드("다시 봐", "최신으로") 자동 인식 안 함 — 추가 LLM 호출 + false positive 위험.

flow_diagram: |
  유저 prompt
    ↓
  UserPromptSubmit hook
    ├─ 1. claude -p → {ambiguity_score, keywords, refined_prompt}
    ├─ 2. keywords로 .imprint/sources.json의 Slack 채널·Notion 페이지 lazy fetch
    ├─ 3. fetched 청크 + 기존 memory_chunks → [Project memory context] prepend
    └─ 4. ambiguity_score > 임계치 시 [Refined prompt suggestion: ...] 추가 prepend
    ↓
  Claude (메인 응답)
    ↓
  Stop hook
    └─ claude -p로 응답 분석 → chunk 추출 → memory_chunks 누적

risks:
  - id: R1
    description: "prefill claude -p 호출이 user-perceived latency를 1-3초 늘려 UX 저하"
    mitigation: "graceful degradation — claude -p가 timeout(예: 3s)이면 silent skip하고 기존 prepend만 진행"
  - id: R2
    description: "Slack/Notion 메시지에 민감정보(API key, 내부 코드)가 포함되어 메모리에 저장될 위험"
    mitigation: "secret redaction 정규식 + 사용자가 sources.json에서 채널·페이지를 명시한 것만 fetch. /memory purge 명령 제공"
  - id: R3
    description: "lazy fetch가 매번 외부 API 호출로 rate limit 도달"
    mitigation: "events 테이블의 자연 캐시 활용 (같은 query는 최근 N분 결과 재사용)"
  - id: R4
    description: "claude -p 응답이 JSON parse 실패해 prefill이 깨짐"
    mitigation: "schema validation 후 실패 시 silent skip, 원본 prompt 그대로 통과"
  - id: R5
    description: "/memory export(D15)로 dump한 JSON에 민감정보(API key, 내부 코드, 디버그 출력)가 포함될 위험"
    mitigation: "export 시 redaction 정규식 자동 적용 + 사용자 검토 step 강제. 자동 git commit/push 없음. import 받는 쪽도 검토 후 수동 적용"
  - id: R6
    description: "trigram tokenizer는 unicode61 대비 인덱스 크기가 3-5배 커짐 (모든 3-gram을 인덱싱). chunk 누적이 수만 단위가 되면 검색 latency 증가"
    mitigation: "도달 시점이 D18 Vector DB 도입 트리거. 운영 중 plugin.log에 검색 latency 추적, 임계 초과 시 Phase 2로 진입"
  - id: R7
    description: "trigram은 의역·언어 혼용(한·영) 검색에 여전히 약함. '결제 흐름' vs 'payment flow'는 매칭되지 않음"
    mitigation: "claude -p가 chunk 추출 시 keywords 배열에 한·영 양쪽 동의어를 함께 채우도록 prompt 설계. 그래도 부족하면 Phase 2 vector"

