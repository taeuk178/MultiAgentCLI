[package]
name = "multi-agent-cli-v2"
version = "0.1.0"
description = "PTY-based multi-agent CLI GUI"
authors = ["taeuk"]
edition = "2021"

[lib]
name = "multi_agent_cli_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tauri-plugin-dialog = "2"
